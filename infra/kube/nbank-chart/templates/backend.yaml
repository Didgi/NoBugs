apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        co.elastic.logs/enabled: "true"
        co.elastic.logs/module: springboot
        co.elastic.logs/json.keys_under_root: "true"
        co.elastic.logs/json.add_error_key: "true"
    spec:
      containers:
        - name: backend
          image: nobugsme/nbank:with_fraud_check_with_approve
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 4111
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.databaseUrl | quote }}

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: SPRING_DATASOURCE_PASSWORD

            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: {{ .Values.databaseDriverClassName | quote }}

            - name: FRAUD_DETECTION_SERVICE_URL
              value: {{ .Values.fraudDetectionServiceUrl | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 4111
            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 4111
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 4111
      targetPort: 4111
  type: NodePort